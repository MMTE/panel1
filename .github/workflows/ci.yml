# GitHub Actions — affected-only CI for the Panel1 Turborepo monorepo
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed for affected-package detection

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Local Turborepo cache layer (complements optional remote cache)
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      # Determine the turbo filter for affected-package detection.
      # - pull_request: diff against the base branch's origin ref.
      # - push: diff against the commit the branch pointed at before this push
      #   (github.event.before). On force-push / branch creation the before-SHA
      #   is missing or unreachable, so run everything (empty filter).
      - name: Set turbo filter
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "filter=--filter=...[origin/${{ github.event.pull_request.base.ref }}]" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.forced }}" != "true" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "filter=--filter=...[${{ github.event.before }}]" >> "$GITHUB_OUTPUT"
          else
            echo "filter=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (affected)
        run: pnpm exec turbo run build ${{ steps.base.outputs.filter }}
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}

      - name: Type-check (affected)
        run: pnpm exec turbo run type-check ${{ steps.base.outputs.filter }}

      - name: Test (affected)
        run: pnpm exec turbo run test ${{ steps.base.outputs.filter }}

      - name: Lint (affected)
        run: pnpm exec turbo run lint ${{ steps.base.outputs.filter }}
